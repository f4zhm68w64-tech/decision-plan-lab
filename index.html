<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#111827">
<title>LAB — Decision Plan</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#111827;background:#f5f6f8}
*{box-sizing:border-box} body{margin:0} button,input,textarea,select{font:inherit}
header{position:sticky;top:0;background:#111827;color:white;padding:calc(14px + env(safe-area-inset-top)) 16px 14px;z-index:5}
header{background:#65318c}header b{font-size:19px}.wrap{max-width:780px;margin:auto;padding:16px 16px calc(30px + env(safe-area-inset-bottom))}
.card{background:white;border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 1px 7px #0001}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.btn{border:0;border-radius:12px;padding:11px 14px;background:#e8ebf0;color:#111827;font-weight:650}.primary{background:#111827;color:white}.danger{background:#fee2e2;color:#991b1b}
input,textarea,select{width:100%;border:1px solid #d7dce3;border-radius:11px;padding:10px;background:white}label{display:block;font-size:13px;font-weight:700;margin:10px 0 5px}
.muted{color:#667085;font-size:14px}.hide{display:none!important}.tabs{display:flex;gap:8px;margin-top:10px}.tabs .btn{flex:1}
.choice{width:100%;text-align:left;border:0;background:white;border-radius:18px;padding:0;overflow:hidden;box-shadow:0 1px 8px #0002;margin:12px 0}
.choice img,.hero{display:block;width:100%;max-height:280px;object-fit:cover}.choice .ct{padding:15px;font-size:18px;font-weight:700}
.item img{display:block;width:100%;height:auto;max-height:420px;object-fit:contain;object-position:center;border-radius:13px}.pill{font-size:12px;background:#eef2ff;padding:4px 8px;border-radius:999px}
hr{border:0;border-top:1px solid #eceff3;margin:16px 0}h2,h3{margin:4px 0 10px}
.topback{display:flex;justify-content:flex-end;margin-bottom:12px}.topback .btn{margin:0}</style><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icon.svg"></head>
<body>

<header id="topbar"><b>🧪 LAB — Decision Plan</b> <span style="font-size:12px;opacity:.65">LAB v0.1.0 · Motor 5.13.3</span> <button id="updateAppBtn" class="btn" style="padding:5px 8px;font-size:12px;margin-left:8px" onclick="forceAppUpdate()">↻ Actualizar app</button><div class="tabs"><button class="btn primary" onclick="goToAdmin()">Planes</button><button class="btn primary" onclick="goToExecution()">▶ Modo Ejecución</button><button class="btn" onclick="configureAdminPin()">🔐 PIN</button></div></header><div style="background:#f4e8ff;color:#4d176a;text-align:center;padding:10px;font-weight:800;border-bottom:2px solid #8d4cb4">🧪 ENTORNO LAB · DATOS FICTICIOS · NO ES PRODUCCIÓN</div><div id="labtests" class="wrap"><div class="card" style="border:2px solid #8d4cb4"><h2>🧪 Pruebas del laboratorio</h2><p class="muted">Ejecuta pruebas sobre datos sintéticos en memoria. No modifica ni los datos del laboratorio ni los de producción.</p><div class="row"><button class="btn primary" onclick="runLabTests()">Ejecutar pruebas</button><button class="btn" id="labExport" onclick="exportLabReport()" disabled>Exportar resultados JSON</button></div><div id="labResults" class="muted" style="margin-top:12px">Todavía no se ejecutaron pruebas.</div></div></div><div id="app" class="wrap"></div>
<script>
const KEY="decision_planner_lab_v1";
let db={plans:[],finalizations:[]}, current=null, history=[], awarded=[];
let uiMode=localStorage.getItem("dplab_ui_mode")||"admin";
const SESSION_KEY="dplab_execution_session_v1",PIN_KEY="dplab_admin_pin_v1";let score={general:0};
function normScore(s){return {general:Number(s?.general)||0}}
function addScore(v){score.general+=(Number(v)||0)}
function eligibleByScore(x){let a=x?.availability;if(!a||a.enabled!==true)return true;let n=score.general;return (a.min==null||a.min===""||n>=Number(a.min))&&(a.max==null||a.max===""||n<=Number(a.max))}

function saveExec(screen="decision",finalId=null,nextDecisionId=null){if(current)localStorage.setItem(SESSION_KEY,JSON.stringify({planId:current.id,history,awarded,score:normScore(score),screen,finalId,nextDecisionId}))}
function getExec(){try{return JSON.parse(localStorage.getItem(SESSION_KEY)||"null")}catch(e){return null}}
function closeExec(){if(!confirm("¿Cerrar la sesión de ejecución actual? Se eliminará únicamente su recorrido e ítems obtenidos; los planes no se modifican."))return;localStorage.removeItem(SESSION_KEY);localStorage.removeItem("dplab_last_idea_v1");localStorage.removeItem("dplab_idea_return_v1");localStorage.removeItem(IDEA_AWARD_BASE_KEY);localStorage.removeItem(SPIN_USAGE_KEY);history=[];awarded=[];score={general:0};current=null;showRunHome()}
function configureAdminPin(){let old=localStorage.getItem(PIN_KEY);if(old){let x=prompt("PIN de administración actual");if(x===null)return;if(x!==old)return alert("PIN incorrecto.")}let a=prompt("Nuevo PIN de administración (4 a 8 dígitos)");if(a===null)return;if(!/^\d{4,8}$/.test(a))return alert("El PIN debe tener entre 4 y 8 dígitos.");let b=prompt("Repetí el nuevo PIN");if(b!==a)return alert("Los PIN no coinciden.");localStorage.setItem(PIN_KEY,a);alert("PIN guardado.")}
function toggleAdministration(){
 if(uiMode!=="admin")return;
 let enabled=localStorage.getItem("dplab_admin_protection_v1")!=="off";
 if(enabled){
  let pin=localStorage.getItem(PIN_KEY);
  if(!pin){alert("Primero configurá un PIN de administración.");configureAdminPin();pin=localStorage.getItem(PIN_KEY);if(!pin){showHome();return}}
  let x=prompt("PIN de administración para desactivar la protección");if(x===null){showHome();return}if(x!==pin){alert("PIN incorrecto.");showHome();return}
  localStorage.setItem("dplab_admin_protection_v1","off");showHome();
 }else{localStorage.setItem("dplab_admin_protection_v1","on");showHome()}
}
function goToExecution(){setUIMode("run")}

function requestAdmin(){
 if(localStorage.getItem("dplab_admin_protection_v1")==="off")return setUIMode("admin");
 let pin=localStorage.getItem(PIN_KEY);
 if(!pin){if(confirm("Todavía no configuraste un PIN. ¿Volver a Administración?"))setUIMode("admin");return}
 let x=prompt("PIN de administración");if(x===null)return;if(x!==pin)return alert("PIN incorrecto.");setUIMode("admin")
}
function goToAdmin(){return requestAdmin()}

function resumeExec(){let s=getExec();if(!s)return;let p=db.plans.find(x=>x.id===s.planId);if(!p){localStorage.removeItem(SESSION_KEY);return showRunHome()}current=p;history=Array.isArray(s.history)?s.history:[];awarded=Array.isArray(s.awarded)?s.awarded:[];score=normScore(s.score);if(s.screen==="final")return results(s.finalId||null);let next=s.nextDecisionId||current.start;if(!next)return alert("No se encontró una decisión para continuar.");setExecutionMode(true);return renderPlay(next)}
function setUIMode(mode){uiMode=mode;localStorage.setItem("dplab_ui_mode",mode);mode==="run"?showRunHome():showHome()}
function showRunHome(){setExecutionMode(false);let s=getExec(),visible=db.plans.filter(p=>planType(p)==="principal"&&p.showInPlayer!==false);$('#app').innerHTML=`<div class=card><h2>Ejecutar</h2>${s?`<button class=choice onclick="resumeExec()"><div class=ct>Continuar ejecución anterior</div></button>`:`<div class=muted>Elegí un plan para comenzar.</div>`}</div>`+(!s&&visible.length?visible.map(p=>`<button class=choice onclick="play('${p.id}')"><div class=ct>${esc(p.name)}</div></button>`).join(""):"")+`<div class=card style="margin-top:28px">${s?`<button class=btn onclick="closeExec()">Cerrar sesión de ejecución</button>`:""} <button class=btn onclick="requestAdmin()">⚙ Administración</button></div>`}
function returnToAdmin(){requestAdmin()}

function idbOpen(){return new Promise((resolve,reject)=>{const r=indexedDB.open("DecisionPlanLabDB",1);r.onupgradeneeded=()=>r.result.createObjectStore("kv");r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
async function idbLoad(){const d=await idbOpen();return new Promise((resolve,reject)=>{const r=d.transaction("kv").objectStore("kv").get(KEY);r.onsuccess=()=>resolve(r.result||{plans:[]});r.onerror=()=>reject(r.error)})}
async function idbSave(){const d=await idbOpen();return new Promise((resolve,reject)=>{const r=d.transaction("kv","readwrite").objectStore("kv").put(db,KEY);r.onsuccess=()=>resolve();r.onerror=()=>reject(r.error)})}
const $=s=>document.querySelector(s), uid=()=>crypto.randomUUID();
function save(){idbSave()}
function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function fileData(inp,cb){let f=inp.files[0]; if(!f)return cb(''); let r=new FileReader();r.onload=()=>cb(r.result);r.readAsDataURL(f)}
function setExecutionMode(on){let bar=document.getElementById("topbar");if(bar)bar.style.display=on?"none":""}
function hiddenItemLibrary(){if(!Array.isArray(db.hiddenItems))db.hiddenItems=[];return db.hiddenItems}
function itemTagLibrary(){if(!Array.isArray(db.itemTags))db.itemTags=[];return db.itemTags}
function tagName(id){return itemTagLibrary().find(t=>t.id===id)?.name||"Sin tag"}
function availableItemsForPlan(p){let seen=new Set(),out=[];[...hiddenItemLibrary(),...(p.items||[])].forEach(i=>{if(i&&!seen.has(i.id)){seen.add(i.id);out.push(i)}});return out}
function findAwardItem(id,plan){return hiddenItemLibrary().find(i=>i.id===id)||(plan?.items||[]).find(i=>i.id===id)}
function editorAwards(x){if(Array.isArray(x.itemAwards))return x.itemAwards.map(a=>({itemId:a?.itemId||"",tagId:a?.tagId||""}));return optionItemIds(x).map(itemId=>({itemId,tagId:""}))}
function normalizeAwards(x){return editorAwards(x).filter(a=>a.itemId)}
function migrateItemTags(){let changed=false,tags=itemTagLibrary(),byName=new Map(tags.map(t=>[String(t.name||"").trim().toLowerCase(),t]));let tagForType=type=>{let n=String(type||"").trim();if(!n)return "";let k=n.toLowerCase(),t=byName.get(k);if(!t){t={id:uid(),name:n};tags.push(t);byName.set(k,t);changed=true}return t.id};let allItems=[...hiddenItemLibrary()];db.plans.forEach(p=>(p.items||[]).forEach(i=>allItems.push(i)));let oldTag=new Map();allItems.forEach(i=>{if(i.type){oldTag.set(i.id,tagForType(i.type));delete i.type;changed=true}});db.plans.forEach(p=>{(p.decisions||[]).forEach(d=>(d.options||[]).forEach(o=>{if(!Array.isArray(o.itemAwards)){o.itemAwards=optionItemIds(o).map(itemId=>({itemId,tagId:oldTag.get(itemId)||""}));changed=true}}));if(planType(p)==="deep"){let L=ensureIdeaLevels(p);["soft","medium","hard"].forEach(k=>["yes","no","up"].forEach(a=>{let x=L[k];if(!x.actionAwards)x.actionAwards={};if(!Array.isArray(x.actionAwards[a])){x.actionAwards[a]=((x.actionItems&&x.actionItems[a])||[]).map(itemId=>({itemId,tagId:oldTag.get(itemId)||""}));changed=true}else{x.actionAwards[a].forEach(r=>{if(!r.tagId&&oldTag.get(r.itemId)){r.tagId=oldTag.get(r.itemId);changed=true}})}}))}});if(changed)save()}
function listHiddenItems(){setExecutionMode(false);let a=hiddenItemLibrary();$('#app').innerHTML=`<div class=card><h2>Ítems ocultos</h2><div class=topback><button class=btn onclick="showHome()">← Volver</button></div><div class=row><button class="btn primary" onclick="newHiddenItem()">+ Ítem oculto</button><button class=btn onclick="listItemTags()">Administrar tags</button></div></div>`+(a.length?a.map(i=>`<div class=card><b>${esc(i.name||"Ítem sin nombre")}</b><div class=row style="margin-top:10px"><button class=btn onclick="editHiddenItem('${i.id}')">Editar</button><button class="btn danger" onclick="deleteHiddenItem('${i.id}')">Eliminar</button></div></div>`).join(""):`<div class=card><div class=muted>Aún no hay ítems ocultos.</div></div>`)}
function newHiddenItem(){let i={id:uid(),name:"Nuevo ítem",description:"",image:""};hiddenItemLibrary().push(i);save();editHiddenItem(i.id)}
function editHiddenItem(id){let i=hiddenItemLibrary().find(x=>x.id===id);if(!i)return;$('#app').innerHTML=`<div class=card><h2>Ítem oculto</h2><label>Nombre</label><input id=hn value="${esc(i.name||"")}"><label>Descripción</label><textarea id=hd>${esc(i.description||"")}</textarea><label>Imagen</label><input id=him type=file accept="image/*">${i.image?`<img class=hero src="${i.image}"><div class=row style="margin-top:8px"><button class="btn danger" onclick="removeHiddenItemImage('${id}')">Quitar imagen</button></div>`:""}<div class=row style="margin-top:14px"><button class="btn primary" onclick="saveHiddenItem('${id}')">Guardar</button><button class=btn onclick="listHiddenItems()">Cancelar</button><button class="btn danger" onclick="deleteHiddenItem('${id}')">Eliminar ítem</button></div></div>`}
function saveHiddenItem(id){let i=hiddenItemLibrary().find(x=>x.id===id);if(!i)return;i.name=$('#hn').value;i.description=$('#hd').value;fileData($('#him'),x=>{if(x)i.image=x;save();listHiddenItems()})}
function removeHiddenItemImage(id){let i=hiddenItemLibrary().find(x=>x.id===id);if(!i)return;i.name=$('#hn').value;i.description=$('#hd').value;i.image="";save();editHiddenItem(id)}
function deleteHiddenItem(id){let used=[];db.plans.forEach(p=>{(p.decisions||[]).forEach(d=>(d.options||[]).forEach(o=>{if(normalizeAwards(o).some(a=>a.itemId===id))used.push(p.name||"Plan")}));if(planType(p)==="deep"){let L=ensureIdeaLevels(p);["soft","medium","hard"].forEach(k=>["yes","no","up"].forEach(a=>{if(((L[k].actionAwards||{})[a]||[]).some(x=>x.itemId===id))used.push(p.name||"Idea")}))}});let msg=used.length?`Este ítem está asignado en: ${[...new Set(used)].join(", ")}. Al eliminarlo, esas asignaciones dejarán de otorgarlo. ¿Continuar?`:"¿Eliminar este ítem oculto?";if(!confirm(msg))return;db.plans.forEach(p=>{(p.decisions||[]).forEach(d=>(d.options||[]).forEach(o=>{o.itemAwards=normalizeAwards(o).filter(a=>a.itemId!==id);o.itemIds=optionItemIds(o).filter(x=>x!==id);o.itemId=""}));if(planType(p)==="deep"){let L=ensureIdeaLevels(p);["soft","medium","hard"].forEach(k=>["yes","no","up"].forEach(a=>{if(L[k].actionAwards)L[k].actionAwards[a]=(L[k].actionAwards[a]||[]).filter(x=>x.itemId!==id)}))}});db.hiddenItems=hiddenItemLibrary().filter(i=>i.id!==id);save();listHiddenItems()}
function listItemTags(){setExecutionMode(false);let a=itemTagLibrary();$('#app').innerHTML=`<div class=card><h2>Tags de ítems</h2><div class=topback><button class=btn onclick="listHiddenItems()">← Volver</button></div><div class=row><button class="btn primary" onclick="newItemTag()">+ Tag</button></div><div class=muted style="margin-top:10px">Los tags se asignan cuando una opción otorga un ítem. Eliminar un tag conserva el ítem y deja esas asignaciones sin tag.</div></div>`+(a.length?a.map(t=>`<div class=card><b>${esc(t.name||"Tag")}</b><div class=row style="margin-top:10px"><button class=btn onclick="editItemTag('${t.id}')">Renombrar</button><button class="btn danger" onclick="deleteItemTag('${t.id}')">Eliminar</button></div></div>`).join(""):`<div class=card><div class=muted>Aún no hay tags.</div></div>`)}
function newItemTag(){let t={id:uid(),name:"Nuevo tag"};itemTagLibrary().push(t);save();editItemTag(t.id)}
function editItemTag(id){let t=itemTagLibrary().find(x=>x.id===id);if(!t)return;$('#app').innerHTML=`<div class=card><h2>Tag</h2><label>Nombre</label><input id=tagname value="${esc(t.name||"")}"><div class=row style="margin-top:14px"><button class="btn primary" onclick="saveItemTag('${id}')">Guardar</button><button class=btn onclick="listItemTags()">Cancelar</button></div></div>`}
function saveItemTag(id){let t=itemTagLibrary().find(x=>x.id===id);if(!t)return;let n=$('#tagname').value.trim();if(!n)return alert("El tag necesita un nombre.");if(itemTagLibrary().some(x=>x.id!==id&&String(x.name||"").trim().toLowerCase()===n.toLowerCase()))return alert("Ya existe un tag con ese nombre.");t.name=n;save();listItemTags()}
function deleteItemTag(id){let t=itemTagLibrary().find(x=>x.id===id);if(!t||!confirm(`¿Eliminar el tag “${t.name}”? Los ítems otorgados con este tag pasarán a “Sin tag”.`))return;db.plans.forEach(p=>{(p.decisions||[]).forEach(d=>(d.options||[]).forEach(o=>{o.itemAwards=normalizeAwards(o).map(a=>({...a,tagId:a.tagId===id?"":a.tagId}))}));if(planType(p)==="deep"){let L=ensureIdeaLevels(p);["soft","medium","hard"].forEach(k=>["yes","no","up"].forEach(a=>((L[k].actionAwards||{})[a]||[]).forEach(x=>{if(x.tagId===id)x.tagId=""})))}});awarded.forEach(a=>{if(a&&typeof a!=="string"&&a.tagId===id)a.tagId=""});db.itemTags=itemTagLibrary().filter(x=>x.id!==id);saveExec("decision",null,null);save();listItemTags()}
function awardRowsEditor(prefix,awards,items,did=null,oid=null){awards=Array.isArray(awards)?awards:[];let tags=itemTagLibrary();return `<div id="${prefix}_rows">${awards.map((a,n)=>`<div class=card style="margin-top:8px"><label>Ítem</label><select id="${prefix}_item_${n}"><option value="">Seleccionar…</option>${items.map(i=>`<option value="${i.id}" ${a.itemId===i.id?"selected":""}>${esc(i.name||"Ítem")}</option>`).join("")}</select><label>Tag al otorgarlo</label><select id="${prefix}_tag_${n}"><option value="" ${!a.tagId?"selected":""}>Sin tag</option>${tags.map(t=>`<option value="${t.id}" ${a.tagId===t.id?"selected":""}>${esc(t.name)}</option>`).join("")}</select>${did&&oid?`<div class=row style="margin-top:8px"><button class="btn danger" onclick="removeOptionAward(\'${did}\',\'${oid}\',${n})">Quitar</button></div>`:""}</div>`).join("")}</div>`}
function readAwardRows(prefix,count){let out=[];for(let n=0;n<count;n++){let i=document.getElementById(`${prefix}_item_${n}`),t=document.getElementById(`${prefix}_tag_${n}`);out.push({itemId:i?.value||"",tagId:t?.value||""})}return out}

function showHome(){
 setExecutionMode(false);if(!db.finalizations)db.finalizations=[];if(uiMode==="run")return showRunHome();
 let group=(t,title)=>`<div class=card><h2>${title}</h2><button class="btn primary" onclick="newPlanOfType('${t}')">+ Nuevo</button></div>`+
 (db.plans.filter(p=>planType(p)===t).length?db.plans.filter(p=>planType(p)===t).map(p=>`<div class=card><b>${esc(p.name)}</b><div class=muted>${p.decisions.length} decisiones</div><div class=row style="margin-top:10px"><button class=btn onclick="openBuilder('${p.id}')">Editar</button><button class=btn onclick="clonePlan('${p.id}')">Clonar</button><button class="btn danger" onclick="delPlan('${p.id}')">Eliminar</button></div></div>`).join(""):`<div class=card><div class=muted>No hay elementos.</div></div>`);
 $('#app').innerHTML=group("principal","Planes principales")+group("secondary","Planes secundarios")+`<div class=card><h2>Ideas</h2><button class="btn primary" onclick="listIdeas()">Administrar ideas</button></div>`+
 `<div class=card><h2>Finalizaciones</h2><button class="btn primary" onclick="listFinalizations()">Administrar finalizaciones</button></div>`+
 `<div class=card><h2>Ítems ocultos</h2><div class=row><button class="btn primary" onclick="listHiddenItems()">Administrar ítems ocultos</button><button class=btn onclick="listItemTags()">Administrar tags</button></div></div>`+
 `<div class=card><h2>Administración</h2><label style="display:flex;align-items:center;gap:10px;font-size:15px"><input type=checkbox style="width:auto" ${localStorage.getItem("dplab_admin_protection_v1")!=="off"?"checked":""} onchange="toggleAdministration()"> Protección de Administración</label><div class=muted style="margin-top:8px">${localStorage.getItem("dplab_admin_protection_v1")==="off"?"Desactivada: Planes → Ejecución sin PIN.":"Activada: Planes → Ejecución requiere PIN."}</div><div class=row style="margin-top:10px"><button class=btn onclick="configureAdminPin()">Gestionar PIN</button></div></div>`+
 `<div class=card><h2>Backup</h2><div class=row><button class="btn primary" onclick="exportEncrypted()">Crear backup cifrado</button><button class=btn onclick="exportAll()">Crear backup JSON</button><label class=btn>Restaurar backup<input type=file accept=".dpbackup,.json,application/json,application/octet-stream" style="display:none" onchange="importAll(this)"></label></div><div class=muted style="margin-top:10px">El backup cifrado usa una contraseña que no se guarda en la aplicación. Si la perdés, no se puede recuperar el contenido.</div></div>`+`<div class=card><h2>Privacidad y datos</h2><p class=muted>Elimina los datos locales de Decision Plan en este navegador. Exportá un backup antes de continuar.</p><button class="btn danger" onclick="eraseAllLocalData()">Borrar todo</button></div>`;
}
function listIdeas(){setExecutionMode(false);let ideas=db.plans.filter(p=>planType(p)==="deep");$('#app').innerHTML=`<div class=card><div class=topback><button class=btn onclick="showHome()">← Volver</button></div><h2>Ideas</h2><button class="btn primary" onclick="newPlanOfType('deep')">+ Nueva Idea</button></div>`+(ideas.length?ideas.map(p=>`<div class=card><b>${esc(p.name)}</b><div class=row style="margin-top:10px"><button class=btn onclick="openBuilder('${p.id}')">Editar</button><button class=btn onclick="clonePlan('${p.id}');listIdeas()">Clonar</button><button class="btn danger" onclick="delPlan('${p.id}')">Eliminar</button></div></div>`).join(""):`<div class=card><div class=muted>No hay Ideas.</div></div>`)}
function planType(p){return p.type||"principal"}
function planTypeLabel(t){return t==="secondary"?"Plan secundario":t==="deep"?"Profundizar tema":"Plan principal"}
function newPlanOfType(t){let p={id:uid(),name:t==="deep"?"Nueva Idea":"Nuevo plan",type:t,hideNameInPlayer:true,showInPlayer:t==="principal",start:null,decisions:[],items:[]};if(t==="deep")ensureIdeaLevels(p);db.plans.push(p);save();openBuilder(p.id)}
function newPlan(){let p={id:uid(),name:"Nuevo plan",type:"principal",hideNameInPlayer:true,showInPlayer:true,start:null,decisions:[],items:[]};db.plans.push(p);save();editPlan(p.id)}
function editPlan(id){current=db.plans.find(p=>p.id===id); renderBuilder()}
function ensureIdeaLevels(p){
 if(!p.ideaLevels)p.ideaLevels={
  soft:{text:p.ideaDefinition||"",yes:"Sí",no:"No",up:"Subir",result:""},
  medium:{text:"",yes:"Sí",no:"No",up:"Subir",result:""},
  hard:{text:"",yes:"Sí",no:"No",result:""}
 };
 ["soft","medium","hard"].forEach(k=>{
  if(!p.ideaLevels[k])p.ideaLevels[k]={text:"",yes:"Sí",no:"No",...(k!=="hard"?{up:"Subir"}:{}),result:""};
  if(p.ideaLevels[k].result==null)p.ideaLevels[k].result="";
  if(!p.ideaLevels[k].actionItems||typeof p.ideaLevels[k].actionItems!=="object")p.ideaLevels[k].actionItems={yes:[],no:[],up:[]};
  if(!p.ideaLevels[k].actionAwards||typeof p.ideaLevels[k].actionAwards!=="object")p.ideaLevels[k].actionAwards={};

function resolveUnavailable(target){
 let fb=String(target?.availability?.fallback||"END");
 if(fb==="END"){saveExec("final",null,null);return results(null)}
 if(fb.startsWith("FINAL:")){let f=(db.finalizations||[]).find(x=>x.id===fb.slice(6));if(!f)return results(null);saveExec("final",f.id,null);return results(f.id)}
 if(fb.startsWith("PLAN:")){
   let p=db.plans.find(x=>x.id===fb.slice(5));if(!p)return results(null);
   if(!eligibleByScore(p))return resolveUnavailable(p);

 }

function rouletteRemaining(f){let cost=Math.max(0,Math.floor(Number(f.spinCost)||0));if(!cost)return Infinity;return Math.max(0,Math.floor((Number(score.general)||0)/cost)-(rouletteUsage()[f.id]||0))}

 if(rouletteRemaining(f)<=0)return results(finalId,false);

 if(!pool.length)return alert("No hay Ideas configuradas para R1.");
 let x=pool[Math.floor(Math.random()*pool.length)],cost=Math.max(0,Math.floor(Number(f.spinCost)||0));
 if(cost){let u=rouletteUsage();u[f.id]=(u[f.id]||0)+1;localStorage.setItem(SPIN_USAGE_KEY,JSON.stringify(u))}

function clonePlan(id){
  let src=db.plans.find(p=>p.id===id);if(!src)return;
  // Deep-copy the complete plan first so newly added plan fields are inherited automatically.
  let copy=JSON.parse(JSON.stringify(src));
  let dm={},im={},om={};
  (src.decisions||[]).forEach(d=>{dm[d.id]=uid();(d.options||[]).forEach(o=>om[o.id]=uid())});
  (src.items||[]).forEach(i=>im[i.id]=uid());
  copy.id=uid();copy.name=(src.name||"Plan")+" (copia)";
  copy.start=src.start?(dm[src.start]||null):null;
  copy.items=(copy.items||[]).map(i=>({...i,id:im[i.id]||uid()}));
  copy.decisions=(copy.decisions||[]).map(d=>({
    ...d,
    id:dm[d.id]||uid(),

function bytesToB64(bytes){let s="",step=0x8000;for(let i=0;i<bytes.length;i+=step)s+=String.fromCharCode(...bytes.subarray(i,i+step));return btoa(s)}

async function exportEncrypted(){

  let now=new Date(),payload={format:"DecisionPlanBackup",version:1,exportedAt:now.toISOString(),data:db};

  let key=await deriveBackupKey(p1,salt,iterations);
  let ciphertext=new Uint8Array(await crypto.subtle.encrypt({name:"AES-GCM",iv},key,new TextEncoder().encode(JSON.stringify(payload))));
  let envelope={format:"DecisionPlanEncryptedBackup",version:1,kdf:{name:"PBKDF2",hash:"SHA-256",iterations,salt:bytesToB64(salt)},cipher:{name:"AES-GCM",iv:bytesToB64(iv)},ciphertext:bytesToB64(ciphertext)};

  let salt=b64ToBytes(parsed.kdf?.salt||""),iv=b64ToBytes(parsed.cipher?.iv||""),iterations=Number(parsed.kdf?.iterations);
